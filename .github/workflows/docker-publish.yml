name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish (e.g. v1.0.0). Leave empty to use latest Cargo.toml version."
        required: false
        type: string
      promote_latest:
        description: "Promote this build to latest tag"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Multi-Arch Image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/pkgs/container/9router-rust
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Docker Tag
        id: meta-tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            CARGO_VER=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
            TAG="v$CARGO_VER"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Docker image for tag: $TAG (version: $VERSION)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.promote_latest != false }}
            type=raw,value=${{ steps.meta-tag.outputs.tag }}
            type=raw,value=${{ steps.meta-tag.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.meta-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.meta-tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.meta-tag.outputs.tag }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
