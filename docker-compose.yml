services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      - PORT=20128
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
    volumes:
      - 9router-data:/app/data

volumes:
  9router-data:
    name: 9router-data
