name: Release & Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. RESOLVE TAG: Read tag from git ref or manual workflow_dispatch input
  # -------------------------------------------------------------------------
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagger.outputs.tag }}
      version: ${{ steps.tagger.outputs.version }}
    steps:
      - name: Resolve Tag
        id: tagger
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing manual tag: $TAG (version: $VERSION)"

  # -------------------------------------------------------------------------
  # 2. BUILD BINARIES: Cross-compile for Linux, Windows, and macOS
  # -------------------------------------------------------------------------
  build-binaries:
    name: Build (${{ matrix.target }})
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        shell: bash
        run: |
          curl -sSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv cross /usr/local/bin/

      - name: Build binary (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package archive (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          BIN_PATH="target/${TARGET}/release/9router"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH="target/release/9router"
          fi
          cp "$BIN_PATH" dist/
          strip dist/9router 2>/dev/null || true
          cp README.md LICENSE CREDITS.md dist/ 2>/dev/null || true
          ASSET_NAME="9router-${TAG}-${TARGET}.tar.gz"
          tar -czvf "$ASSET_NAME" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET_NAME" > "${ASSET_NAME}.sha256"
          else
            shasum -a 256 "$ASSET_NAME" > "${ASSET_NAME}.sha256"
          fi

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $BinPath = "target/$env:TARGET/release/9router.exe"
          if (-not (Test-Path $BinPath)) {
            $BinPath = "target/release/9router.exe"
          }
          Copy-Item $BinPath dist/
          if (Test-Path README.md) { Copy-Item README.md dist/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/ }
          if (Test-Path CREDITS.md) { Copy-Item CREDITS.md dist/ }
          $AssetName = "9router-$env:TAG-$env:TARGET.zip"
          Compress-Archive -Path dist/* -DestinationPath $AssetName
          $Hash = (Get-FileHash $AssetName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $AssetName" | Out-File -Encoding ascii "$AssetName.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.sha256

  # -------------------------------------------------------------------------
  # 3. GITHUB RELEASE: Publish release with attached binaries & checksums
  # -------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [resolve-tag, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Generate unified checksums and detailed release description
        shell: bash
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cd release-assets
          cat *.sha256 > checksums-sha256.txt
          cd ..

          # Extract git log since previous semver tag
          PREV_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -B1 -x "$TAG" | head -1 || true)
          if [ "$PREV_TAG" == "$TAG" ] || [ -z "$PREV_TAG" ]; then
            COMMITS_LOG=$(git log --oneline -n 25 --no-merges --pretty=format:"- %s (%h by @%an)")
          else
            COMMITS_LOG=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges --pretty=format:"- %s (%h by @%an)")
          fi

          cat <<EOF > release_body.md
          # 🚀 9Router-Rust ${TAG}

          **100% Native Rust AI Gateway with Built-in Headroom Context Compression.**
          High-performance OpenAI, Claude, Codex, and Gemini API router with <15MB idle RAM and 15,400+ req/s throughput.

          ---

          ## 📦 What's Changed

          ${COMMITS_LOG}

          ---

          ## ⚡ Download Precompiled Binaries

          | Platform | Target Architecture | Download Archive |
          | :--- | :--- | :--- |
          | 🐧 **Linux (x86_64)** | \`x86_64-unknown-linux-gnu\` | [\`9router-${TAG}-x86_64-unknown-linux-gnu.tar.gz\`](https://github.com/${REPO}/releases/download/${TAG}/9router-${TAG}-x86_64-unknown-linux-gnu.tar.gz) |
          | 🐧 **Linux (ARM64)** | \`aarch64-unknown-linux-gnu\` | [\`9router-${TAG}-aarch64-unknown-linux-gnu.tar.gz\`](https://github.com/${REPO}/releases/download/${TAG}/9router-${TAG}-aarch64-unknown-linux-gnu.tar.gz) |
          | 🪟 **Windows (x64)** | \`x86_64-pc-windows-msvc\` | [\`9router-${TAG}-x86_64-pc-windows-msvc.zip\`](https://github.com/${REPO}/releases/download/${TAG}/9router-${TAG}-x86_64-pc-windows-msvc.zip) |
          | 🍏 **macOS (Apple Silicon)** | \`aarch64-apple-darwin\` | [\`9router-${TAG}-aarch64-apple-darwin.tar.gz\`](https://github.com/${REPO}/releases/download/${TAG}/9router-${TAG}-aarch64-apple-darwin.tar.gz) |
          | 🍏 **macOS (Intel)** | \`x86_64-apple-darwin\` | [\`9router-${TAG}-x86_64-apple-darwin.tar.gz\`](https://github.com/${REPO}/releases/download/${TAG}/9router-${TAG}-x86_64-apple-darwin.tar.gz) |

          ---

          ## 🐳 Run with Docker (GitHub Container Registry)

          \`\`\`bash
          docker run -d \\
            -p 20128:20128 \\
            -v "\$HOME/.9router:/app/data" \\
            -e DATA_DIR=/app/data \\
            --name 9router \\
            ghcr.io/${REPO}:${TAG}
          \`\`\`

          Web Dashboard is available at **http://localhost:20128/dashboard**.

          ---

          ## 🔒 SHA-256 Checksums

          Verify package integrity using \`checksums-sha256.txt\`:

          \`\`\`bash
          # Linux
          sha256sum -c checksums-sha256.txt

          # macOS
          shasum -a 256 -c checksums-sha256.txt

          # Windows (PowerShell)
          Get-FileHash .\\9router-${TAG}-x86_64-pc-windows-msvc.zip -Algorithm SHA256
          \`\`\`

          ---

          ## 💡 Core Capabilities
          - **Ultra-Low Memory Footprint**: Uses only \`< 15MB RSS\` idle memory (89% reduction vs Node.js).
          - **Built-in Headroom Compression**: SmartCrusher, DiffCompressor, LogCompressor, SearchCompressor, CodeCompressor, and RagCompressor saving 20–60% context tokens out of the box.
          - **Universal API Compatibility**: Bidirectional translation between OpenAI Chat Completions, Claude Messages, Codex Responses, and Gemini APIs.
          - **Resilient Fallback**: Automatic multi-account failover with strike counters and model combo rotation.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: "9Router-Rust ${{ needs.resolve-tag.outputs.tag }}"
          draft: false
          prerelease: false
          body_path: release_body.md
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # 4. PACKAGES: Build multi-arch Docker image and push to GHCR
  # -------------------------------------------------------------------------
  docker-packages:
    name: Publish Packages (Docker GHCR)
    needs: [resolve-tag, release]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.resolve-tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.resolve-tag.outputs.tag }}
            type=raw,value=${{ needs.resolve-tag.outputs.version }}
            type=semver,pattern={{version}},value=${{ needs.resolve-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.resolve-tag.outputs.tag }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
