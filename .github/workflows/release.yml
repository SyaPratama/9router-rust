name: Release & Packages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom tag to release (e.g. v1.0.1). Leave empty for auto-tag."
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. AUTO TAG: Calculate next semver tag and push to repository
  # -------------------------------------------------------------------------
  tag:
    name: Auto Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagger.outputs.tag }}
      version: ${{ steps.tagger.outputs.version }}
      created: ${{ steps.tagger.outputs.created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate and Push Tag
        id: tagger
        shell: bash
        run: |
          set -e
          git fetch --tags --force 2>/dev/null || true

          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            echo "Using manual input tag: $TAG"
          else
            # Read base version from Cargo.toml
            CARGO_VER=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
            echo "Cargo.toml version: $CARGO_VER"

            # Check if HEAD already has a tag
            HEAD_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+' | head -1 || true)
            if [ -n "$HEAD_TAG" ]; then
              echo "HEAD is already tagged: $HEAD_TAG"
              TAG="$HEAD_TAG"
            elif ! git rev-parse "refs/tags/v${CARGO_VER}" >/dev/null 2>&1; then
              TAG="v${CARGO_VER}"
              echo "Base tag $TAG does not exist. Using it."
            else
              LATEST_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
              if [ -z "$LATEST_TAG" ]; then
                LATEST_TAG="v${CARGO_VER}"
              fi
              echo "Latest tag: $LATEST_TAG"

              COMMITS=$(git log "${LATEST_TAG}..HEAD" --oneline 2>/dev/null || true)
              MAJOR=$(echo "$LATEST_TAG" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1/')
              MINOR=$(echo "$LATEST_TAG" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\2/')
              PATCH=$(echo "$LATEST_TAG" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\3/')

              if echo "$COMMITS" | grep -iE '(breaking change|!:)' >/dev/null; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              elif echo "$COMMITS" | grep -iE '^([a-f0-9]+ )?feat(\([^)]+\))?:' >/dev/null; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi

              TAG="v${MAJOR}.${MINOR}.${PATCH}"
              echo "Calculated incremented tag: $TAG"
            fi
          fi

          # Ensure tag format starts with v
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi

          CREATED="false"
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            CREATED="true"
            echo "Successfully pushed $TAG to origin"
          else
            echo "Tag $TAG already exists on remote"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 2. BUILD BINARIES: Cross-compile for Linux, Windows, and macOS
  # -------------------------------------------------------------------------
  build-binaries:
    name: Build (${{ matrix.target }})
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        shell: bash
        run: |
          curl -sSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv cross /usr/local/bin/

      - name: Build binary (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package archive (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          BIN_PATH="target/${TARGET}/release/9router"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH="target/release/9router"
          fi
          cp "$BIN_PATH" dist/
          strip dist/9router 2>/dev/null || true
          cp README.md LICENSE CREDITS.md dist/ 2>/dev/null || true
          ASSET_NAME="9router-${TAG}-${TARGET}.tar.gz"
          tar -czvf "$ASSET_NAME" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET_NAME" > "${ASSET_NAME}.sha256"
          else
            shasum -a 256 "$ASSET_NAME" > "${ASSET_NAME}.sha256"
          fi

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $BinPath = "target/$env:TARGET/release/9router.exe"
          if (-not (Test-Path $BinPath)) {
            $BinPath = "target/release/9router.exe"
          }
          Copy-Item $BinPath dist/
          if (Test-Path README.md) { Copy-Item README.md dist/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/ }
          if (Test-Path CREDITS.md) { Copy-Item CREDITS.md dist/ }
          $AssetName = "9router-$env:TAG-$env:TARGET.zip"
          Compress-Archive -Path dist/* -DestinationPath $AssetName
          $Hash = (Get-FileHash $AssetName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $AssetName" | Out-File -Encoding ascii "$AssetName.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.sha256

  # -------------------------------------------------------------------------
  # 3. GITHUB RELEASE: Publish release with attached binaries & checksums
  # -------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [tag, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Generate unified checksums file
        shell: bash
        run: |
          cd release-assets
          cat *.sha256 > checksums-sha256.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: "9Router-Rust ${{ needs.tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # 4. PACKAGES: Build multi-arch Docker image and push to GHCR
  # -------------------------------------------------------------------------
  docker-packages:
    name: Publish Packages (Docker GHCR)
    needs: [tag, release]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.tag.outputs.tag }}
            type=raw,value=${{ needs.tag.outputs.version }}
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.tag.outputs.tag }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
