name: Release & Packages

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Explicit version (e.g. 1.0.1) if 'custom' is selected"
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. AUTO TAG: Calculate version and create tag on bump
  # -------------------------------------------------------------------------
  tag:
    name: Auto Tag & Version Resolution
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagger.outputs.tag }}
      version: ${{ steps.tagger.outputs.version }}
      should_release: ${{ steps.tagger.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Version and Manage Tag
        id: tagger
        shell: bash
        run: |
          set -e
          git fetch --tags --force 2>/dev/null || true

          SHOULD_RELEASE="true"

          # 1. Triggered directly by a pushed tag (e.g. git push origin v1.0.1)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "Triggered by pushed tag: $TAG (version: $VERSION)"

          # 2. Triggered manually via workflow_dispatch button
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CURR_VER=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
            BUMP_TYPE="${{ inputs.bump }}"

            if [ "$BUMP_TYPE" == "custom" ]; then
              NEW_VER="${{ inputs.custom_version }}"
              if [ -z "$NEW_VER" ]; then
                echo "Error: custom_version is required when bump=custom"
                exit 1
              fi
            else
              MAJOR=$(echo "$CURR_VER" | cut -d. -f1)
              MINOR=$(echo "$CURR_VER" | cut -d. -f2)
              PATCH=$(echo "$CURR_VER" | cut -d. -f3)
              case "$BUMP_TYPE" in
                major) NEW_VER="$((MAJOR + 1)).0.0" ;;
                minor) NEW_VER="${MAJOR}.$((MINOR + 1)).0" ;;
                patch|*) NEW_VER="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              esac
            fi

            TAG="v${NEW_VER}"
            VERSION="${NEW_VER}"
            echo "Manual dispatch bump requested: $CURR_VER -> $NEW_VER"

            # Update Cargo.toml
            sed -i -E "s/^version = \".*\"/version = \"${NEW_VER}\"/" Cargo.toml

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): bump version to ${TAG} [skip ci]"
            git push origin master

            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"

          # 3. Triggered by push to master
          else
            CARGO_VER=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
            TAG="v${CARGO_VER}"
            VERSION="${CARGO_VER}"
            echo "Detected Cargo.toml version: $CARGO_VER"

            # Check if tag already exists on remote
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "New version detected in Cargo.toml ($CARGO_VER). Creating tag $TAG..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
              echo "Successfully pushed tag $TAG to origin"
            else
              # Version in Cargo.toml is already tagged. Check if commit message requests bump
              COMMIT_MSG=$(git log -1 --pretty=%B)
              if echo "$COMMIT_MSG" | grep -iE '(\[bump\]|\[release\]|release:)' >/dev/null; then
                MAJOR=$(echo "$CARGO_VER" | cut -d. -f1)
                MINOR=$(echo "$CARGO_VER" | cut -d. -f2)
                PATCH=$(echo "$CARGO_VER" | cut -d. -f3)
                NEW_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
                TAG="v${NEW_VER}"
                VERSION="${NEW_VER}"
                echo "Commit message requested bump to $TAG"
                sed -i -E "s/^version = \".*\"/version = \"${NEW_VER}\"/" Cargo.toml
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git commit -am "chore(release): bump version to ${TAG} [skip ci]"
                git push origin master
                git tag -a "$TAG" -m "Release $TAG"
                git push origin "$TAG"
              else
                echo "Version $CARGO_VER is already tagged as $TAG. Skipping release."
                SHOULD_RELEASE="false"
              fi
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 2. BUILD BINARIES: Cross-compile for Linux, Windows, and macOS
  # -------------------------------------------------------------------------
  build-binaries:
    name: Build (${{ matrix.target }})
    needs: tag
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        shell: bash
        run: |
          curl -sSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv cross /usr/local/bin/

      - name: Build binary (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package archive (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          BIN_PATH="target/${TARGET}/release/9router"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH="target/release/9router"
          fi
          cp "$BIN_PATH" dist/
          strip dist/9router 2>/dev/null || true
          cp README.md LICENSE CREDITS.md dist/ 2>/dev/null || true
          ASSET_NAME="9router-${TAG}-${TARGET}.tar.gz"
          tar -czvf "$ASSET_NAME" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET_NAME" > "${ASSET_NAME}.sha256"
          else
            shasum -a 256 "$ASSET_NAME" > "${ASSET_NAME}.sha256"
          fi

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $BinPath = "target/$env:TARGET/release/9router.exe"
          if (-not (Test-Path $BinPath)) {
            $BinPath = "target/release/9router.exe"
          }
          Copy-Item $BinPath dist/
          if (Test-Path README.md) { Copy-Item README.md dist/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/ }
          if (Test-Path CREDITS.md) { Copy-Item CREDITS.md dist/ }
          $AssetName = "9router-$env:TAG-$env:TARGET.zip"
          Compress-Archive -Path dist/* -DestinationPath $AssetName
          $Hash = (Get-FileHash $AssetName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $AssetName" | Out-File -Encoding ascii "$AssetName.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.sha256

  # -------------------------------------------------------------------------
  # 3. GITHUB RELEASE: Publish release with attached binaries & checksums
  # -------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [tag, build-binaries]
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Generate unified checksums file
        shell: bash
        run: |
          cd release-assets
          cat *.sha256 > checksums-sha256.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: "9Router-Rust ${{ needs.tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # 4. PACKAGES: Build multi-arch Docker image and push to GHCR
  # -------------------------------------------------------------------------
  docker-packages:
    name: Publish Packages (Docker GHCR)
    needs: [tag, release]
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.tag.outputs.tag }}
            type=raw,value=${{ needs.tag.outputs.version }}
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.tag.outputs.tag }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
