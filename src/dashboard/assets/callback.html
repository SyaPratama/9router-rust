<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authentication Callback — 9Router</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e17;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #121824;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 32px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
      color: #ffffff;
      font-weight: 700;
    }
    p {
      font-size: 13.5px;
      color: #94a3b8;
      margin: 0 0 16px;
      line-height: 1.5;
    }
    .url-box {
      background: #1e293b;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      word-break: break-all;
      color: #34d399;
      margin-bottom: 20px;
      text-align: left;
      user-select: all;
    }
    .btn {
      display: inline-block;
      background: #10b981;
      color: #000000;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #34d399;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="status-title">Authorization Received</h1>
    <p id="status-desc">Communicating authentication tokens back to 9Router...</p>
    <div class="url-box" id="url-box" style="display:none;"></div>
    <a href="/dashboard" class="btn" id="return-btn">Return to Dashboard</a>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const token = params.get('token') || params.get('access_token');
      const state = params.get('state');
      const error = params.get('error');
      const fullUrl = window.location.href;

      const urlBox = document.getElementById('url-box');
      if (urlBox) {
        urlBox.textContent = fullUrl;
        urlBox.style.display = 'block';
      }

      if (window.opener) {
        try {
          window.opener.postMessage({
            type: 'oauth_callback',
            data: {
              code: code,
              token: token,
              state: state,
              error: error,
              fullUrl: fullUrl
            }
          }, '*');

          document.getElementById('status-title').textContent = 'Connected Successfully!';
          document.getElementById('status-desc').textContent = 'Closing popup window and returning to 9Router...';
          setTimeout(function() {
            try { window.close(); } catch(e) {}
          }, 1000);
        } catch (e) {
          console.error('postMessage failed:', e);
        }
      } else {
        document.getElementById('status-desc').textContent = 'If 9Router did not connect automatically, copy the URL below and paste it into Step 2.';
      }
    })();
  </script>
</body>
</html>
