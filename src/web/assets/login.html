<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — 9Router</title><link rel="stylesheet" href="/site/assets/site.css"></head>
<body class="auth-page"><main class="auth-shell"><a class="wordmark" href="/landing">9Router</a><section class="auth-card"><span class="eyebrow">Welcome back</span><h1>Sign in to your gateway</h1><p class="muted">Manage providers, routing, usage, and access from the control plane.</p><form id="login-form"><label>Email or username<input name="identity" autocomplete="username" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><div class="form-meta"><label class="check"><input type="checkbox" name="remember"> Remember me</label><a href="/callback">Forgot password?</a></div><button class="button primary full" type="submit">Sign in</button><div id="login-message" class="form-message" role="status"></div></form><div class="divider"><span>or continue locally</span></div><a class="button ghost full" href="/dashboard">Open local dashboard</a></section><p class="auth-footer">New here? <a href="/landing">Learn about 9Router</a></p></main><script>document.getElementById("login-form").addEventListener("submit",function(e){e.preventDefault();document.getElementById("login-message").textContent="Local gateway mode is ready. Open the dashboard to continue.";});</script></body></html>
