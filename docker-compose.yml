services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 9router-rust
    restart: unless-stopped
    ports:
      - "20129:20128"
    environment:
      - PORT=20128
      - HOST=0.0.0.0
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:?Set INITIAL_PASSWORD to a non-default password}
      - DATA_DIR=/app/data
    volumes:
      - 9router-rust-data:/app/data

volumes:
  9router-rust-data:
    name: 9router-rust-data
