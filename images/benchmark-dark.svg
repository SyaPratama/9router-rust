<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img"
     aria-label="9Router-Rust Benchmark Performance Comparison against 9Router Next.js and OmniRoute">
  <title>9Router-Rust Performance Benchmark</title>

  <defs>
    <!-- Headroom / Obsidian Brand Palette from hero.svg -->
    <!-- Mint: #00F0B5 | Obsidian: #070A0F | Midnight: #0C1118 | Cyan: #65D8FF | Slate: #98A4B3 | Border: #1B2532 -->

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F0B5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="50%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#00F0B5" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#00F0B5" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00F0B5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0B5"/>
      <stop offset="100%" stop-color="#65D8FF"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#65D8FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <style>
      .s { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .label-head { font-family: Inter, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #98A4B3; text-transform: uppercase; }
      .val-mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Layers -->
  <rect width="1200" height="680" fill="#070A0F"/>
  <rect width="1200" height="680" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- ── 1. HEADER SECTION ─────────────────────────────────────────────── -->
  <!-- Geometric Gateway Vector Icon (no emoji) -->
  <g transform="translate(60, 42)" stroke="#00F0B5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#0C1118" stroke="#1B2532"/>
    <circle cx="18" cy="18" r="4" fill="#00F0B5"/>
    <path d="M18 6v4M18 26v4M6 18h4M26 18h4"/>
    <circle cx="18" cy="6" r="1.5" fill="#65D8FF"/>
    <circle cx="18" cy="30" r="1.5" fill="#65D8FF"/>
    <circle cx="6" cy="18" r="1.5" fill="#65D8FF"/>
    <circle cx="30" cy="18" r="1.5" fill="#65D8FF"/>
  </g>

  <text x="110" y="66" class="s" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">9Router-Rust Benchmark Performance</text>
  <text x="110" y="92" class="s" font-size="13.5" fill="#98A4B3">Live TCP loopback socket measurements vs 9Router (Next.js) and OmniRoute on 4-vCPU host @ concurrency 50</text>

  <!-- Architecture Pill Badge (top right) -->
  <rect x="946" y="44" width="194" height="32" rx="16" fill="#0C1118" stroke="#00F0B5" stroke-opacity="0.3"/>
  <circle cx="964" cy="60" r="4" fill="#00F0B5"/>
  <text x="977" y="64" class="s" font-size="11" font-weight="600" letter-spacing="1.5" fill="#00F0B5">NATIVE RUST ENGINE</text>

  <!-- ── 2. TOP KPI CARDS ──────────────────────────────────────────────── -->
  <!-- Card 1: Throughput -->
  <g transform="translate(60, 122)">
    <rect width="348" height="92" rx="8" fill="#0C1118" stroke="#1B2532"/>
    <line x1="0" y1="0" x2="348" y2="0" stroke="#00F0B5" stroke-width="2"/>
    <!-- Speedometer Vector Icon -->
    <g transform="translate(24, 24)" stroke="#00F0B5" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M4 22 A 13 13 0 1 1 24 22"/>
      <path d="M14 14 L19 9" stroke-width="2"/>
      <circle cx="14" cy="14" r="2.5" fill="#00F0B5"/>
    </g>
    <text x="64" y="38" class="m" font-size="28" font-weight="700" fill="#00F0B5">29.3x</text>
    <text x="64" y="58" class="label-head">THROUGHPUT MULTIPLIER</text>
    <text x="64" y="74" class="s" font-size="11.5" fill="#6B7888">15,408 req/s vs 525 req/s legacy</text>
  </g>

  <!-- Card 2: Memory -->
  <g transform="translate(426, 122)">
    <rect width="348" height="92" rx="8" fill="#0C1118" stroke="#1B2532"/>
    <line x1="0" y1="0" x2="348" y2="0" stroke="#65D8FF" stroke-width="2"/>
    <!-- Microchip Vector Icon -->
    <g transform="translate(24, 24)" stroke="#65D8FF" stroke-width="1.8" fill="none" stroke-linecap="round">
      <rect x="5" y="5" width="18" height="18" rx="2" fill="#070A0F"/>
      <path d="M9 1V5M14 1V5M19 1V5M9 23V27M14 23V27M19 23V27M1 9H5M1 14H5M1 19H5M23 9H27M23 14H27M23 19H27"/>
      <rect x="10" y="10" width="8" height="8" rx="1" fill="#65D8FF" opacity="0.4"/>
    </g>
    <text x="64" y="38" class="m" font-size="28" font-weight="700" fill="#65D8FF">14.4 MB</text>
    <text x="64" y="58" class="label-head">IDLE MEMORY (RSS)</text>
    <text x="64" y="74" class="s" font-size="11.5" fill="#6B7888">89% reduction vs 131 MB Next.js</text>
  </g>

  <!-- Card 3: Latency -->
  <g transform="translate(792, 122)">
    <rect width="348" height="92" rx="8" fill="#0C1118" stroke="#1B2532"/>
    <line x1="0" y1="0" x2="348" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Precision Timer Vector Icon -->
    <g transform="translate(24, 24)" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round">
      <circle cx="14" cy="15" r="11"/>
      <path d="M14 10v5l4 2"/>
      <path d="M11 2h6M14 2v2"/>
    </g>
    <text x="64" y="38" class="m" font-size="28" font-weight="700" fill="#FFFFFF">2.58 ms</text>
    <text x="64" y="58" class="label-head">MEDIAN LATENCY (P50)</text>
    <text x="64" y="74" class="s" font-size="11.5" fill="#6B7888">33.5x faster than 86.4 ms legacy</text>
  </g>

  <!-- ── 3. COMPARISON PANELS ───────────────────────────────────────────── -->

  <!-- PANEL 1: Throughput -->
  <g transform="translate(60, 234)">
    <rect width="348" height="388" rx="8" fill="#0C1118" stroke="#1B2532"/>
    
    <!-- Panel Header -->
    <text x="24" y="36" class="s" font-size="15" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">THROUGHPUT</text>
    <rect x="236" y="20" width="88" height="22" rx="4" fill="#00F0B5" fill-opacity="0.1" stroke="#00F0B5" stroke-opacity="0.3"/>
    <text x="280" y="35" class="s" font-size="9" font-weight="700" letter-spacing="0.8" fill="#00F0B5" text-anchor="middle">HIGHER IS BETTER</text>

    <!-- Row 1: 9Router-Rust -->
    <g transform="translate(24, 65)">
      <rect width="300" height="90" rx="6" fill="#070A0F" stroke="#1B2532"/>
      <text x="16" y="24" class="s" font-size="13" font-weight="600" fill="#FFFFFF">9Router-Rust</text>
      <rect x="232" y="11" width="54" height="18" rx="3" fill="#00F0B5" fill-opacity="0.15"/>
      <text x="259" y="23" class="s" font-size="10" font-weight="700" fill="#00F0B5" text-anchor="middle">29.3x</text>
      <text x="16" y="47" class="val-mono" fill="#00F0B5">15,408 req/s</text>
      
      <!-- Progress Bar Track -->
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#111822"/>
      <rect x="16" y="58" width="268" height="18" rx="4" fill="url(#mintGrad)"/>
      <rect x="281" y="58" width="3" height="18" fill="#FFFFFF"/>
    </g>

    <!-- Row 2: 9Router Next.js -->
    <g transform="translate(24, 168)">
      <rect width="300" height="90" rx="6" fill="#070A0F" stroke="#1B2532"/>
      <text x="16" y="24" class="s" font-size="13" font-weight="500" fill="#98A4B3">9Router (Next.js)</text>
      <rect x="210" y="11" width="76" height="18" rx="3" fill="#1B2532"/>
      <text x="248" y="23" class="s" font-size="10" font-weight="600" fill="#6B7888" text-anchor="middle">1.0x baseline</text>
      <text x="16" y="47" class="val-mono" fill="#98A4B3">525 req/s</text>
      
      <!-- Progress Bar Track -->
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#111822"/>
      <rect x="16" y="58" width="16" height="18" rx="4" fill="#2C3B4E"/>
    </g>

    <!-- Row 3: OmniRoute -->
    <g transform="translate(24, 271)">
      <rect width="300" height="90" rx="6" fill="#070A0F" stroke="#1B2532"/>
      <text x="16" y="24" class="s" font-size="13" font-weight="500" fill="#98A4B3">OmniRoute</text>
      <rect x="232" y="11" width="54" height="18" rx="3" fill="#1B2532"/>
      <text x="259" y="23" class="s" font-size="10" font-weight="600" fill="#6B7888" text-anchor="middle">0.67x</text>
      <text x="16" y="47" class="val-mono" fill="#98A4B3">354 req/s</text>
      
      <!-- Progress Bar Track -->
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#111822"/>
      <rect x="16" y="58" width="12" height="18" rx="4" fill="#1F2937"/>
    </g>
  </g>

  <!-- PANEL 2: Idle Memory (RSS) -->
  <g transform="translate(426, 234)">
    <rect width="348" height="388" rx="8" fill="#0C1118" stroke="#1B2532"/>
    
    <!-- Panel Header -->
    <text x="24" y="36" class="s" font-size="15" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">IDLE MEMORY (RSS)</text>
    <rect x="236" y="20" width="88" height="22" rx="4" fill="#65D8FF" fill-opacity="0.1" stroke="#65D8FF" stroke-opacity="0.3"/>
    <text x="280" y="35" class="s" font-size="9" font-weight="700" letter-spacing="0.8" fill="#65D8FF" text-anchor="middle">LOWER IS BETTER</text>

    <!-- Row 1: 9Router-Rust -->
    <g transform="translate(24, 65)">
      <rect width="300" height="90" rx="6" fill="#070A0F" stroke="#1B2532"/>
      <text x="16" y="24" class="s" font-size="13" font-weight="600" fill="#FFFFFF">9Router-Rust</text>
      <rect x="218" y="11" width="68" height="18" rx="3" fill="#00F0B5" fill-opacity="0.15"/>
      <text x="252" y="23" class="s" font-size="10" font-weight="700" fill="#00F0B5" text-anchor="middle">89% LESS</text>
      <text x="16" y="47" class="val-mono" fill="#00F0B5">14.4 MB</text>
      
      <!-- Progress Bar Track -->
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#111822"/>
      <rect x="16" y="58" width="18" height="18" rx="4" fill="url(#mintGrad)"/>
      <rect x="31" y="58" width="3" height="18" fill="#FFFFFF"/>
    </g>

    <!-- Row 2: 9Router Next.js -->
    <g transform="translate(24, 168)">
      <rect width="300" height="90" rx="6" fill="#070A0F" stroke="#1B2532"/>
      <text x="16" y="24" class="s" font-size="13" font-weight="500" fill="#98A4B3">9Router (Next.js)</text>
      <rect x="216" y="11" width="70" height="18" rx="3" fill="#1B2532"/>
      <text x="251" y="23" class="s" font-size="10" font-weight="600" fill="#6B7888" text-anchor="middle">9.1x larger</text>
      <text x="16" y="47" class="val-mono" fill="#98A4B3">131.0 MB</text>
      
      <!-- Progress Bar Track -->
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#111822"/>
      <rect x="16" y="58" width="84" height="18" rx="4" fill="#2C3B4E"/>
    </g>

    <!-- Row 3: OmniRoute -->
    <g transform="translate(24, 271)">
      <rect width="300" height="90" rx="6" fill="#070A0F" stroke="#1B2532"/>
      <text x="16" y="24" class="s" font-size="13" font-weight="500" fill="#98A4B3">OmniRoute</text>
      <rect x="210" y="11" width="76" height="18" rx="3" fill="#1B2532"/>
      <text x="248" y="23" class="s" font-size="10" font-weight="600" fill="#6B7888" text-anchor="middle">29.4x larger</text>
      <text x="16" y="47" class="val-mono" fill="#98A4B3">424.0 MB</text>
      
      <!-- Progress Bar Track -->
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#111822"/>
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#374151"/>
    </g>
  </g>

  <!-- PANEL 3: Median Latency (p50) -->
  <g transform="translate(792, 234)">
    <rect width="348" height="388" rx="8" fill="#0C1118" stroke="#1B2532"/>
    
    <!-- Panel Header -->
    <text x="24" y="36" class="s" font-size="15" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">MEDIAN LATENCY (P50)</text>
    <rect x="236" y="20" width="88" height="22" rx="4" fill="#65D8FF" fill-opacity="0.1" stroke="#65D8FF" stroke-opacity="0.3"/>
    <text x="280" y="35" class="s" font-size="9" font-weight="700" letter-spacing="0.8" fill="#65D8FF" text-anchor="middle">LOWER IS BETTER</text>

    <!-- Row 1: 9Router-Rust -->
    <g transform="translate(24, 65)">
      <rect width="300" height="90" rx="6" fill="#070A0F" stroke="#1B2532"/>
      <text x="16" y="24" class="s" font-size="13" font-weight="600" fill="#FFFFFF">9Router-Rust</text>
      <rect x="210" y="11" width="76" height="18" rx="3" fill="#65D8FF" fill-opacity="0.15"/>
      <text x="248" y="23" class="s" font-size="10" font-weight="700" fill="#65D8FF" text-anchor="middle">33.5x FASTER</text>
      <text x="16" y="47" class="val-mono" fill="#65D8FF">2.58 ms</text>
      
      <!-- Progress Bar Track -->
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#111822"/>
      <rect x="16" y="58" width="14" height="18" rx="4" fill="url(#cyanGrad)"/>
      <rect x="27" y="58" width="3" height="18" fill="#FFFFFF"/>
    </g>

    <!-- Row 2: 9Router Next.js -->
    <g transform="translate(24, 168)">
      <rect width="300" height="90" rx="6" fill="#070A0F" stroke="#1B2532"/>
      <text x="16" y="24" class="s" font-size="13" font-weight="500" fill="#98A4B3">9Router (Next.js)</text>
      <rect x="216" y="11" width="70" height="18" rx="3" fill="#1B2532"/>
      <text x="251" y="23" class="s" font-size="10" font-weight="600" fill="#6B7888" text-anchor="middle">33.5x slower</text>
      <text x="16" y="47" class="val-mono" fill="#98A4B3">86.4 ms</text>
      
      <!-- Progress Bar Track -->
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#111822"/>
      <rect x="16" y="58" width="188" height="18" rx="4" fill="#2C3B4E"/>
    </g>

    <!-- Row 3: OmniRoute -->
    <g transform="translate(24, 271)">
      <rect width="300" height="90" rx="6" fill="#070A0F" stroke="#1B2532"/>
      <text x="16" y="24" class="s" font-size="13" font-weight="500" fill="#98A4B3">OmniRoute</text>
      <rect x="216" y="11" width="70" height="18" rx="3" fill="#1B2532"/>
      <text x="251" y="23" class="s" font-size="10" font-weight="600" fill="#6B7888" text-anchor="middle">47.7x slower</text>
      <text x="16" y="47" class="val-mono" fill="#98A4B3">123.1 ms</text>
      
      <!-- Progress Bar Track -->
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#111822"/>
      <rect x="16" y="58" width="268" height="18" rx="4" fill="#374151"/>
    </g>
  </g>

  <!-- ── 4. FOOTER ─────────────────────────────────────────────────────── -->
  <rect x="60" y="642" width="3" height="12" fill="#00F0B5"/>
  <text x="72" y="652" class="m" font-size="11" fill="#6B7888">Tested on /api/health across 1,000 requests @ concurrency 50 on 4-vCPU host. Reproducible with cargo test and 9router bench</text>
  <text x="1140" y="652" class="s" font-size="11" fill="#6B7888" text-anchor="end">Obsidian &amp; Mint Architecture · 100% Native Rust</text>
</svg>
